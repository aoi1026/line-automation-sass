<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#04a648"/>
      <stop offset="0.55" stop-color="#06C755"/>
      <stop offset="1" stop-color="#3ddc84"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#003b18" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="16" fill="url(#shine)"/>

  <!-- decorative circles -->
  <circle cx="1080" cy="40" r="140" fill="#ffffff" opacity="0.06"/>
  <circle cx="1150" cy="260" r="90" fill="#ffffff" opacity="0.08"/>
  <circle cx="60" cy="290" r="120" fill="#ffffff" opacity="0.05"/>

  <!-- chat bubbles (right side) -->
  <g filter="url(#soft)">
    <rect x="800" y="64" width="300" height="52" rx="18" fill="#ffffff"/>
    <text x="822" y="96" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="19" fill="#1f2937">ご予約ありがとうございます✨</text>
  </g>
  <g filter="url(#soft)">
    <rect x="860" y="132" width="272" height="52" rx="18" fill="#eafff2"/>
    <text x="882" y="164" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="19" fill="#065f46">明日14:30にお待ちしています</text>
  </g>
  <g filter="url(#soft)">
    <rect x="812" y="200" width="300" height="52" rx="18" fill="#ffffff"/>
    <text x="834" y="232" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="19" fill="#1f2937">🎁 バースデークーポン到着</text>
  </g>

  <!-- logo mark -->
  <g transform="translate(84, 100)" filter="url(#soft)">
    <rect width="120" height="120" rx="30" fill="#ffffff"/>
    <path d="M60 32c-17.7 0-32 12.1-32 27 0 8.6 4.8 16.2 12.3 21.1-.4 1.6-1.6 5.6-1.9 6.5-.3 1.2.4 1.2 1 .9.7-.4 8-5.4 11.2-7.6 3 .7 6.2 1.1 9.4 1.1 17.7 0 32-12.1 32-27S77.7 32 60 32z" fill="#06C755"/>
    <path d="M52 84c2.6.4 5.3.6 8 .6 3.1 0 6.1-.3 9-.8" stroke="#06C755" stroke-width="0" fill="none"/>
    <path d="M44 56l6 6 12-12" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M87 78c6-2 10-6 12-10" stroke="#06C755" stroke-width="0" fill="none"/>
    <path d="M78 62c4.4 0 8-3.1 8-7" stroke="#ffffff" stroke-width="0" fill="none"/>
  </g>

  <!-- title -->
  <text x="238" y="158" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-weight="700" font-size="64" fill="#ffffff">リピナビ</text>
  <text x="240" y="206" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="26" fill="#eafff2">LINEで、リピーターを自動で育てる。</text>
  <text x="240" y="246" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="17" fill="#d1fae5" opacity="0.9">美容サロンのための LINE 顧客リピート自動化 SaaS</text>
</svg>
